# Render Blueprint for the API. Frontend is deployed separately on Vercel.
services:
  - type: web
    name: trendtube-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your hosted PostgreSQL URL in the Render dashboard
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
      - key: PYTHON_VERSION
        value: 3.12.3
